import tkinter as tk
from tkinter import ttk
import subprocess

class MainWindow(tk.Tk):
    def __init__(self):
        super().__init__()

        self.title("Trợ lý Terminal cho MacBook")
        self.geometry("400x250") # Kích thước cửa sổ ban đầu
        self.configure(bg='#333333') # Màu nền tối

        # Cấu hình style cho các widget
        style = ttk.Style(self)
        self.tk.call("source", "theme.tcl") # Giả sử bạn có file theme.tcl để tùy chỉnh giao diện
        style.theme_use("custom_theme")

        style.configure("TLabelFrame", background="#333333", foreground="white", borderwidth=0)
        style.configure("TLabelFrame.Label", background="#333333", foreground="white", font=("Helvetica", 14, "bold"))
        style.configure("TButton", font=("Helvetica", 12), background="#4F4F4F", foreground="white", borderwidth=0, padding=10)
        style.map("TButton",
            background=[('active', '#666666')],
            relief=[('pressed', 'flat'), ('!pressed', 'flat')]
        )

        # --- Khung GPU ---
        gpu_frame = ttk.LabelFrame(self, text=" 🎮 GPU")
        gpu_frame.pack(padx=20, pady=15, fill="x")

        # Các nút trong khung GPU
        btn_discrete_gpu = ttk.Button(gpu_frame, text="Dùng GPU rời", command=self.use_discrete_gpu)
        btn_discrete_gpu.pack(fill='x', padx=5, pady=4)

        btn_integrated_gpu = ttk.Button(gpu_frame, text="Dùng GPU tích hợp", command=self.use_integrated_gpu)
        btn_integrated_gpu.pack(fill='x', padx=5, pady=4)

        btn_auto_gpu = ttk.Button(gpu_frame, text="GPU chế độ tự động", command=self.use_auto_gpu)
        btn_auto_gpu.pack(fill='x', padx=5, pady=4)

        btn_check_gpu = ttk.Button(gpu_frame, text="Kiểm tra GPU", command=self.check_gpu)
        btn_check_gpu.pack(fill='x', padx=5, pady=4)

    # --- Các hàm xử lý cho nút (hiện tại chỉ in ra terminal) ---
    def run_command(self, command):
        """Thực thi một lệnh shell và in kết quả."""
        try:
            print(f"Đang chạy lệnh: {command}")
            # subprocess.run(command, shell=True, check=True)
            # Tạm thời chỉ in ra, bạn có thể bỏ comment dòng trên để thực thi thật
        except subprocess.CalledProcessError as e:
            print(f"Lỗi khi chạy lệnh: {e}")

    def use_discrete_gpu(self):
        # Lưu ý: Lệnh `pmset` cần quyền quản trị (sudo)
        self.run_command("sudo pmset -a gpuswitch 1")
        print("Yêu cầu chuyển sang GPU rời. Có thể cần mật khẩu.")

    def use_integrated_gpu(self):
        self.run_command("sudo pmset -a gpuswitch 0")
        print("Yêu cầu chuyển sang GPU tích hợp. Có thể cần mật khẩu.")

    def use_auto_gpu(self):
        self.run_command("sudo pmset -a gpuswitch 2")
        print("Yêu cầu chuyển sang chế độ GPU tự động. Có thể cần mật khẩu.")

    def check_gpu(self):
        self.run_command("pmset -g | grep gpuswitch")